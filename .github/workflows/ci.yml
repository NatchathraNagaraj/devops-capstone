name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          pip install -r app/requirements.txt
          cd app && pytest

      - name: Build image
        run: docker build -t natchathra14/todo-api:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: natchathra14/todo-api:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag natchathra14/todo-api:${{ github.sha }} natchathra14/todo-api:latest
          docker push natchathra14/todo-api:${{ github.sha }}
          docker push natchathra14/todo-api:latest
